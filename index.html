<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giga portafolio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="start-screen" class="start-screen">
   

    <img class="start-logo" src="assets/sprites/menu/mi_name.png" alt="Logo del portafolio">
   <img class="yo" src="assets/sprites/menu/yo_menu.png" alt="Logo del portafolio">
    
    <p class="start-contacto-email">Contacto <br> albarracingianluca308@gmail.com </p>
    
   
    <div>
      
      <button class="start-contacto-icon" id="contacto-artstation" onclick="window.open('https://www.artstation.com/garnix_tyh')">
        <img class="start-contacto-icon" src="assets/sprites/menu/art_icon.png" alt="Icono de artstation">
      </button>
      <button class="start-contacto-icon" id="contacto-instagram" onclick="window.open('https://www.instagram.com/garnix_tyh/')">
        <img class="start-contacto-icon" src="assets/sprites/menu/ig_icon.png" alt="Icono de Instagram">
      </button>
      <button id="start-btn"> Proyectos</button> 
    </div>
    <p class="start-footer-legend">7º1 — 2026 - Programación VI</p>
    
  </div>
  <div id="room-transition" class="room-transition"></div>

  <div id="app" class="app">

    <main class="game-main">
      <div id="stage" class="stage">
        <div id="viewport" class="viewport">
          <div id="world" class="room-world"></div>
        </div>
        <div id="dialogue-box" class="dialogue-box">
          <p id="dialogue-text"></p>
          <span class="dialogue-cue">>siguiente</span>
        </div>
      </div>
    </main>
    

    
    <!-- Plantilla de modal: duplicá este <section> completo para crear uno nuevo.
         Cambiá el id (formato "modal-<algo>") y usá ese <algo> en el campo "modal" de una terminal. -->
    <section id="modal-template" class="modal">
      <article class="modal-panel">
        <button class="modal-close" data-close>✕</button>
        <h2>Título</h2>
        <p>Contenido de ejemplo.</p>
      </article>
    </section>

  </div>

    <script src="game.js"></script>
</body>
</html>
